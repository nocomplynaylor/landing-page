<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naylor CC — Protect Your Project Margin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F4EFE7;
    --bg-card: #FBF7F0;
    --fg: #0B1E3F;
    --fg-soft: #2A3A5A;
    --fg-mute: #5A6A85;
    --rule: #D9D0C0;
    --accent: #E8541C;
    --accent-deep: #B8390C;
    --warn: #C9492C;
    --ok: #2F5D3A;

    --serif: 'Source Serif 4', 'Iowan Old Style', Georgia, serif;
    --sans: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    --maxw: 1240px;
  }

  [data-theme="navy-orange"] {
    --bg: #F4EFE7; --bg-card: #FBF7F0; --fg: #0B1E3F; --fg-soft: #2A3A5A;
    --fg-mute: #5A6A85; --rule: #D9D0C0; --accent: #E8541C; --accent-deep: #B8390C;
  }
  [data-theme="charcoal-amber"] {
    --bg: #EFEBE4; --bg-card: #F7F3EC; --fg: #1A1A18; --fg-soft: #3A3A36;
    --fg-mute: #6B6A63; --rule: #D6D0C2; --accent: #C8841E; --accent-deep: #8E5A0F;
  }
  [data-theme="forest-cream"] {
    --bg: #F0EBE0; --bg-card: #F8F4EB; --fg: #14342B; --fg-soft: #2C4D42;
    --fg-mute: #5E7268; --rule: #D2CDBE; --accent: #B8400E; --accent-deep: #842A05;
  }
  [data-theme="ink-safety"] {
    --bg: #ECECEC; --bg-card: #F6F6F6; --fg: #111111; --fg-soft: #333333;
    --fg-mute: #6A6A6A; --rule: #D0D0D0; --accent: #FF6A00; --accent-deep: #C24700;
  }

  [data-type="serif-inter"] { --serif: 'Source Serif 4', Georgia, serif; --sans: 'Inter Tight', sans-serif; }
  [data-type="fraunces-dm"]  { --serif: 'Fraunces', Georgia, serif; --sans: 'DM Sans', sans-serif; }
  [data-type="instrument-inter"] { --serif: 'Instrument Serif', Georgia, serif; --sans: 'Inter Tight', sans-serif; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  a { color: inherit; }
  button { font: inherit; cursor: pointer; }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 32px; }

  .topbar {
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--fg-mute);
  }
  .topbar .wrap { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; padding-bottom: 10px; }
  .topbar .states { display: flex; gap: 18px; }
  .topbar .states span::before { content: "●"; color: var(--accent); margin-right: 6px; font-size: 8px; vertical-align: 2px; }

  .nav {
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(8px);
  }
  .nav .wrap { display: flex; justify-content: space-between; align-items: center; padding-top: 18px; padding-bottom: 18px; }
  .logo {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex; align-items: baseline; gap: 10px;
  }
  .logo .mark {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    border-left: 2px solid var(--accent);
    padding-left: 8px;
  }
  .nav-links { display: flex; gap: 28px; align-items: center; font-size: 14px; color: var(--fg-soft); }
  .nav-links a { text-decoration: none; }
  .nav-links a:hover { color: var(--accent); }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 20px;
    border-radius: 2px;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.01em;
    text-decoration: none;
    border: 1px solid transparent;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn-ghost { background: transparent; color: var(--fg); border-color: var(--fg); }
  .btn-ghost:hover { background: var(--fg); color: var(--bg); }
  .btn-lg { padding: 16px 28px; font-size: 15px; }
  .btn .arrow { display: inline-block; transition: transform 0.15s; }
  .btn:hover .arrow { transform: translateX(3px); }

  h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; margin: 0; }
  h1 { font-size: clamp(48px, 6.4vw, 92px); font-weight: 400; letter-spacing: -0.025em; }
  h2 { font-size: clamp(36px, 4.4vw, 60px); }
  h3 { font-size: 28px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 24px;
  }

  section { padding: 64px 0; border-bottom: 1px solid var(--rule); }
  section.tight { padding: 64px 0; }

  .hero { padding: 64px 0; border-bottom: 1px solid var(--rule); }
  .hero h1 em { font-style: italic; color: var(--accent); font-weight: 400; }
  .hero-sub {
    font-size: 19px; color: var(--fg-soft); max-width: 580px;
    line-height: 1.55; margin: 28px 0 36px;
  }
  .hero-cta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .hero-cta .meta { font-family: var(--mono); font-size: 12px; color: var(--fg-mute); letter-spacing: 0.05em; }

  .hero-a-sec { display: flex; align-items: center; min-height: 780px; padding: 64px 0 87px; }
  .hero-a { display: grid; grid-template-columns: 1.15fr 1fr; gap: 64px; align-items: end; width: 100%; }
  .hero-a .lede { padding-bottom: 8px; }
  .hero-a .visual { aspect-ratio: 4/5; position: relative; }

  .hero-b .statement { max-width: 1100px; }
  .hero-b h1 { font-size: clamp(56px, 8vw, 124px); line-height: 0.98; }
  .hero-b .meta-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 24px; margin-top: 72px; padding-top: 32px;
    border-top: 1px solid var(--rule);
  }
  .hero-b .meta-row .cell .k { font-family: var(--mono); font-size: 11px; color: var(--fg-mute); letter-spacing: 0.12em; text-transform: uppercase; }
  .hero-b .meta-row .cell .v { font-family: var(--serif); font-size: 22px; margin-top: 6px; }

  .hero-c { display: grid; grid-template-columns: 360px 1fr; gap: 72px; align-items: start; }
  .hero-c .file-tag {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--fg-mute);
    border: 1px solid var(--rule); padding: 14px 16px;
    background: var(--bg-card);
  }
  .hero-c .file-tag .row { display: flex; justify-content: space-between; padding: 4px 0; }
  .hero-c .file-tag .row .v { color: var(--fg); }
  .hero-c .file-tag .stamp {
    margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--rule);
    color: var(--accent); font-size: 13px;
  }

  .placeholder {
    background:
      repeating-linear-gradient(135deg,
        color-mix(in oklch, var(--fg) 6%, transparent) 0,
        color-mix(in oklch, var(--fg) 6%, transparent) 1px,
        transparent 1px, transparent 12px),
      var(--bg-card);
    border: 1px solid var(--rule);
    position: relative; overflow: hidden;
    display: flex; align-items: flex-end;
  }
  .placeholder .ph-label {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--fg-mute);
    background: var(--bg-card); padding: 8px 10px; margin: 12px;
    border: 1px solid var(--rule);
  }
  .placeholder .ph-corner {
    position: absolute; top: 12px; right: 12px;
    font-family: var(--mono); font-size: 10px; color: var(--fg-mute);
  }

  .strip {
    background: var(--fg); color: var(--bg);
    padding: 28px 0;
    border-bottom: 1px solid var(--fg);
    overflow: hidden;
  }
  .strip-inner {
    display: flex; gap: 64px; align-items: center;
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    animation: scroll 40s linear infinite;
  }
  .strip-inner span { display: inline-flex; align-items: center; gap: 16px; }
  .strip-inner span::before {
    content: ""; width: 6px; height: 6px; background: var(--accent); display: inline-block;
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .prob-sec { min-height: 768px; display: flex; align-items: center; padding: 64px 0; }

  .problem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 72px; border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
  .problem-card {
    border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    padding: 36px 32px 40px;
    background: var(--bg-card);
    position: relative;
  }
  .problem-card .num {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    color: var(--accent); margin-bottom: 24px; display: flex; justify-content: space-between;
  }
  .problem-card h3 { font-size: 30px; margin-bottom: 16px; line-height: 1.1; }
  .problem-card .desc { color: var(--fg-soft); font-size: 15.5px; line-height: 1.55; }
  .problem-card .stat {
    margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--rule);
    font-family: var(--mono); font-size: 12px; color: var(--fg-mute); letter-spacing: 0.04em;
  }
  .problem-card .stat strong { color: var(--accent); font-weight: 500; font-size: 14px; }

  .quote-block {
    margin-top: 96px; padding: 56px 64px;
    border-left: 3px solid var(--accent);
    background: var(--bg-card);
    display: grid; grid-template-columns: 1fr 220px; gap: 48px; align-items: center;
  }
  .quote-block .q {
    font-family: var(--serif); font-style: italic;
    font-size: 28px; line-height: 1.3; letter-spacing: -0.01em;
    color: var(--fg);
  }
  .quote-block .attrib { font-family: var(--mono); font-size: 12px; color: var(--fg-mute); letter-spacing: 0.06em; margin-top: 20px; text-transform: uppercase; }
  .quote-block .portrait { aspect-ratio: 1; }

  .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 96px; align-items: start; }
  .twocol .lhs h2 { margin-bottom: 24px; }
  .twocol .lhs p { color: var(--fg-soft); font-size: 17px; line-height: 1.6; max-width: 480px; }
  .twocol .rhs { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--rule); }
  .checklist-item { display: flex; gap: 20px; padding: 22px 0; border-bottom: 1px solid var(--rule); align-items: flex-start; }
  .checklist-item .check {
    width: 28px; height: 28px; flex: 0 0 28px;
    border: 1px solid var(--accent); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 14px; margin-top: 2px;
  }
  .checklist-item .ci-body strong { font-family: var(--serif); font-size: 19px; font-weight: 500; display: block; margin-bottom: 4px; }
  .checklist-item .ci-body span { color: var(--fg-soft); font-size: 15px; }

  .approach-stat {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.03em;
    color: var(--fg-mute); line-height: 1.7; margin-top: 22px; max-width: 480px;
  }

  .serve-head { max-width: 920px; }
  .serve-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    margin-top: 64px;
    border-top: 1px solid var(--rule); border-left: 1px solid var(--rule);
  }
  .serve-cell {
    border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    padding: 40px 36px 44px;
    background: var(--bg-card);
  }
  .serve-cell .k {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    color: var(--accent); margin-bottom: 22px;
  }
  .serve-cell h3 { font-size: 30px; margin-bottom: 16px; line-height: 1.1; }
  .serve-cell p { color: var(--fg-soft); font-size: 16px; line-height: 1.6; margin: 0; }

  .logos { margin-top: 64px; padding-top: 40px; border-top: 1px solid var(--rule); }
  .logos-label {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--fg-mute); margin-bottom: 28px;
  }
  .logos-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; border-left: 1px solid var(--rule); }
  .logo-cell {
    border-right: 1px solid var(--rule);
    padding: 28px 16px;
    display: flex; align-items: center; justify-content: center;
    color: var(--fg-mute);
    font-family: var(--serif); font-style: italic; font-size: 17px;
    letter-spacing: -0.01em;
    height: 96px;
    background: var(--bg-card);
  }

  .cta-section {
    background: var(--fg); color: var(--bg);
    padding: 64px 0;
    border-bottom: 0;
  }
  .cta-section h2 { color: var(--bg); }
  .cta-section .eyebrow { color: var(--accent); }
  .cta-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 96px; align-items: start; }
  .cta-grid .lhs h2 em { font-style: italic; color: var(--accent); font-weight: 400; }
  .cta-grid .lhs .sub {
    font-size: 18px; color: color-mix(in oklch, var(--bg) 70%, var(--fg));
    line-height: 1.55; margin-top: 24px; max-width: 460px;
  }
  .promises { margin-top: 48px; display: flex; flex-direction: column; gap: 18px; }
  .promises .p {
    display: flex; gap: 14px; align-items: flex-start;
    font-size: 15px;
    color: color-mix(in oklch, var(--bg) 80%, var(--fg));
  }
  .promises .p::before {
    content: ""; width: 8px; height: 8px; background: var(--accent);
    margin-top: 7px; flex: 0 0 8px;
  }

  .form-card {
    background: var(--bg-card); color: var(--fg);
    padding: 40px;
    border: 1px solid color-mix(in oklch, var(--bg) 30%, var(--fg));
  }
  .form-card .ftitle { font-family: var(--serif); font-size: 24px; margin-bottom: 4px; letter-spacing: -0.01em; }
  .form-card .fsub {
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--fg-mute); margin-bottom: 28px;
  }
  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--fg-mute);
    margin-bottom: 8px;
  }
  .field input {
    width: 100%; padding: 14px 0; border: 0;
    border-bottom: 1px solid var(--rule);
    background: transparent; color: var(--fg);
    font-family: var(--sans); font-size: 16px;
    outline: none; transition: border-color 0.15s;
  }
  .field input:focus { border-bottom-color: var(--accent); }
  .field input::placeholder { color: var(--fg-mute); opacity: 0.6; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .form-card .submit-row { margin-top: 32px; display: flex; flex-direction: column; gap: 16px; }
  .form-card .submit-row .btn-primary { width: 100%; justify-content: center; padding: 18px; font-size: 15px; }
  .form-card .fineprint {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em;
    color: var(--fg-mute); line-height: 1.6;
  }
  .form-success { padding: 24px 0; text-align: center; }
  .form-success .check-big {
    width: 56px; height: 56px; margin: 0 auto 20px;
    border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }

  footer {
    background: var(--bg);
    padding: 56px 0 40px;
    font-size: 13px;
    color: var(--fg-mute);
    font-family: var(--mono);
    letter-spacing: 0.04em;
  }
  footer .wrap { display: flex; justify-content: space-between; align-items: center; }
  footer .links { display: flex; gap: 28px; }

  .timeline {
    background: var(--bg-card);
    border: 1px solid var(--rule);
    padding: 32px;
    margin-top: 72px;
  }
  .timeline h4 {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--fg-mute); margin-bottom: 24px;
    display: flex; justify-content: space-between;
  }
  .timeline h4 span { color: var(--accent); }
  .tl-bars { display: flex; flex-direction: column; gap: 16px; }
  .tl-bar { display: grid; grid-template-columns: 200px 1fr 80px; align-items: center; gap: 20px; }
  .tl-bar .label { font-family: var(--serif); font-size: 16px; }
  .tl-bar .track { height: 8px; background: var(--bg); border: 1px solid var(--rule); position: relative; }
  .tl-bar .fill { position: absolute; top: 0; bottom: 0; left: 0; }
  .tl-bar.before .fill { background: var(--warn); width: 92%; }
  .tl-bar.after  .fill { background: var(--ok);   width: 28%; }
  .tl-bar .v { font-family: var(--mono); font-size: 13px; color: var(--fg-soft); text-align: right; }

  @keyframes heroFlash {
    0%   { opacity: 0; }
    18%  { opacity: 0.92; }
    100% { opacity: 0; }
  }
  .hero-a .visual .flash {
    position: absolute; inset: 0;
    background: #fff;
    pointer-events: none;
    opacity: 0;
    animation: heroFlash 1200ms ease-out;
  }

  @keyframes heroPan {
    0%   { object-position: 0% var(--pan-y, 50%); }
    100% { object-position: 100% var(--pan-y, 50%); }
  }
  @keyframes heroPanRev {
    0%   { object-position: 100% var(--pan-y, 50%); }
    100% { object-position: 0% var(--pan-y, 50%); }
  }
  .hero-a .visual img.panning     { animation: heroPan    var(--pan-speed, 30s) linear forwards; }
  .hero-a .visual img.panning.rev { animation: heroPanRev var(--pan-speed, 30s) linear forwards; }

  @media (max-width: 960px) {
    .hero-a-sec { min-height: 0; padding: 48px 0 56px; }
    .hero-a .visual { aspect-ratio: 3/2; }
    .prob-sec { min-height: 0; }
    .hero-a, .hero-c, .twocol, .cta-grid { grid-template-columns: 1fr; gap: 48px; }
    .hero-c { gap: 32px; }
    .problem-grid { grid-template-columns: 1fr; }
    .serve-grid { grid-template-columns: 1fr; }
    .quote-block { grid-template-columns: 1fr; padding: 32px; }
    .quote-block .portrait { display: none; }
    .logos-row { grid-template-columns: repeat(2, 1fr); }
    .nav-links { display: none; }
    .hero-b .meta-row { grid-template-columns: repeat(2, 1fr); }
    .field-row { grid-template-columns: 1fr; }
    section { padding: 64px 0; }
    .topbar .states { display: none; }
  }
</style>
</head>
<body data-theme="navy-orange" data-type="serif-inter">

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{

  "heroPanSpeed": 20
}/*EDITMODE-END*/;

</html>
